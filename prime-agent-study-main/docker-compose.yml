services:
  # D9 durable workspace / journal SoT — matches supervisor DATABASE_URL below.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yal}
      POSTGRES_DB: ${POSTGRES_DB:-supervisor}
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yal} -d ${POSTGRES_DB:-supervisor}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First start only: a database for the memory service.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro

  # D13 local demo: Jaeger all-in-one (OTLP gRPC 4317 + UI 16686).
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "4317:4317"
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  supervisor:
    build:
      context: .
      dockerfile: services/supervisor/Dockerfile
    ports:
      - "8080:8080"
    environment: &supervisor-env
      # Every session runs as a Temporal workflow executed by supervisor-worker.
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-supervisor-sessions}
      # PROFILE=dev: local stack may run with auth relaxed. Staging/prod must not.
      PROFILE: ${PROFILE:-dev}
      ENV: ${ENV:-development}
      # Shared with BFF AI_SERVICE_JWT_SECRET so local JWTs verify (override via env).
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-local-service-jwt-secret-32b!!}
      AI_SERVICE_JWT_SECRET: ${AI_SERVICE_JWT_SECRET:-${SERVICE_JWT_SECRET:-dev-local-service-jwt-secret-32b!!}}
      GATEWAY_BASE_URL: http://model-gateway:8090
      GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-dev-local-gateway-token}
      # D13: export spans to Jaeger (OTLP). Soft-fail if Jaeger is down.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      YAL_OTEL_SAMPLE_RATIO: ${YAL_OTEL_SAMPLE_RATIO:-1.0}
      YAL_REAPER_INTERVAL_S: ${YAL_REAPER_INTERVAL_S:-300}
      # Object store credentials (OBJECT_STORAGE default set below with D9 SoT pins).
      OBJECT_STORAGE_ENDPOINT: http://seaweed-s3:8333
      OBJECT_STORAGE_BUCKET: yal-workspace
      OBJECT_STORAGE_ACCESS_KEY: any
      OBJECT_STORAGE_SECRET_KEY: any
      # Grants default memory for local; staging compose pins postgres.
      GRANT_STORE: ${GRANT_STORE:-memory}
      # D5 E1: keys stay on model-gateway. Signal non-echo Test without copying vendor keys:
      #   OPENROUTER_API_KEY=… (gateway) GATEWAY_VENDOR_READY=1 YAL_MODEL_ROUTE=githi
      #   or MODEL_GATEWAY_DEFAULT_ROUTE=githi on both services.
      YAL_MODEL_ROUTE: ${YAL_MODEL_ROUTE:-}
      GATEWAY_VENDOR_READY: ${GATEWAY_VENDOR_READY:-0}
      MODEL_GATEWAY_DEFAULT_ROUTE: ${MODEL_GATEWAY_DEFAULT_ROUTE:-echo}
      # Docker image tree is shallow — pin paths to mounted / writable dirs.
      YAL_CATALOG_DIR: ${YAL_CATALOG_DIR:-/harness}
      HARNESS_VERSIONS_DIR: ${HARNESS_VERSIONS_DIR:-/harness/versions}
      YAL_CONTRACTS_DIR: ${YAL_CONTRACTS_DIR:-/contracts}
      BLOB_DIR: ${BLOB_DIR:-/tmp/yal-blobs}
      # Local demo: load harness compositions from YAL_CATALOG_DIR (/harness mount).
      # Escape hatch (skip catalog / incomplete harness): YAL_LOAD_COMPOSITION_CATALOG=false
      YAL_LOAD_COMPOSITION_CATALOG: ${YAL_LOAD_COMPOSITION_CATALOG:-true}
      # D10: local docker sandbox for coding/githi (override via SANDBOX_PROVIDER).
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-local_docker}
      # D9 durable SoT defaults (override to memory for single-container without Postgres).
      WORKSPACE_STORE: ${WORKSPACE_STORE:-postgres}
      OBJECT_STORAGE: seaweed
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yal}:${POSTGRES_PASSWORD:-yal}@postgres:5432/${POSTGRES_DB:-supervisor}
      # Long-term memory (remember, durable recall); calls carry a service JWT.
      MEMORY_SERVICE_URL: http://memory-service:8092
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN:-dev-local-memory-token}
    depends_on:
      postgres:
        condition: service_healthy
      model-gateway:
        condition: service_started
      seaweed-s3:
        condition: service_started
      jaeger:
        condition: service_started
      temporal-namespace:
        condition: service_completed_successfully
    volumes: &supervisor-volumes
      - ./harness:/harness:ro
      - ./contracts:/contracts:ro
      # Needed when SANDBOX_PROVIDER=local_docker (githi-v1 runs its tools in a sandbox).
      - /var/run/docker.sock:/var/run/docker.sock

  # Runs every session workflow and holds the live runtimes and sandboxes.
  # Scale out with `docker compose up --scale supervisor-worker=N`.
  supervisor-worker:
    build:
      context: .
      dockerfile: services/supervisor/Dockerfile
    command: ["python", "-m", "supervisor.temporal.worker"]
    environment: *supervisor-env
    volumes: *supervisor-volumes
    # Lets in-flight activities finish (graceful_shutdown_timeout is 30s).
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      model-gateway:
        condition: service_started
      seaweed-s3:
        condition: service_started

  # Temporal: schema in the shared Postgres (databases temporal + temporal_visibility).
  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.0}
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    environment:
      POSTGRES_SEEDS: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-yal}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-yal}
    volumes:
      - ./deploy/temporal:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.0}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-yal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-yal}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./deploy/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    depends_on:
      temporal-schema:
        condition: service_completed_successfully

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.0}
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./deploy/temporal:/scripts:ro
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.49.1}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      # 8080 is the supervisor API.
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # Independently developable — can also `docker compose up model-gateway` alone.
  model-gateway:
    build:
      context: .
      dockerfile: services/model-gateway/Dockerfile
    ports:
      - "8090:8090"
    environment:
      PROFILE: ${PROFILE:-dev}
      ENV: ${ENV:-development}
      # Non-empty default for local. Empty tokens only if PROFILE=dev and you override explicitly.
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-dev-local-gateway-token}
      MODEL_GATEWAY_DEFAULT_ROUTE: ${MODEL_GATEWAY_DEFAULT_ROUTE:-echo}
      # Echo-only catalog so /v1/readyz is green without vendor keys (same idea as staging).
      # Override MODEL_GATEWAY_ROUTES_JSON when OPENROUTER/OPENAI keys are set for real routes.
      MODEL_GATEWAY_ROUTES_JSON: ${MODEL_GATEWAY_ROUTES_JSON:-{"echo":{"provider":"echo","upstream_model":"echo"},"fake":{"provider":"echo","upstream_model":"fake"}}}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # D13 B: gateway child spans → Jaeger (soft-fail if collector down).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_SERVICE_NAME: yal-model-gateway
    depends_on:
      - jaeger

  # Long-term memory: facts a user's sessions remember across sessions.
  memory-service:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    ports:
      - "8092:8092"
    environment:
      ENV: ${ENV:-development}
      MEMORY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yal}:${POSTGRES_PASSWORD:-yal}@postgres:5432/memory
      # Verifies the supervisor's service JWTs (same secret as the supervisor).
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-local-service-jwt-secret-32b!!}
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN:-dev-local-memory-token}
      MEMORY_ALLOW_STATIC_TOKEN: ${MEMORY_ALLOW_STATIC_TOKEN:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/v1/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  # Track B WP-M1: S3-compatible object store. App uses ObjectStorage Protocol only.
  seaweed-master:
    image: chrislusf/seaweedfs:3.68
    command: "master -ip=seaweed-master -port=9333"
    ports:
      - "9333:9333"

  seaweed-volume:
    image: chrislusf/seaweedfs:3.68
    command: "volume -mserver=seaweed-master:9333 -port=8081 -ip=seaweed-volume"
    depends_on:
      - seaweed-master
    ports:
      - "8081:8081"

  seaweed-filer:
    image: chrislusf/seaweedfs:3.68
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    depends_on:
      - seaweed-master
      - seaweed-volume
    ports:
      - "8888:8888"

  seaweed-s3:
    image: chrislusf/seaweedfs:3.68
    # Default -ip.bind is localhost — unreachable from supervisor / host publish.
    command: "s3 -filer=seaweed-filer:8888 -port=8333 -ip.bind=0.0.0.0"
    depends_on:
      - seaweed-filer
    ports:
      - "8333:8333"

volumes:
  pgdata:
