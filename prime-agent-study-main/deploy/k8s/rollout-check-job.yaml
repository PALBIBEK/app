# The pre-deploy replay gate: run the NEW image against the cluster's Temporal before rolling
# it out. It replays the histories of running (then recent) sessions with the new workflow code
# and fails (exit 1) if any cannot be reproduced: that build would break runs in flight.
#   kubectl -n prime-control apply -f rollout-check-job.yaml && kubectl -n prime-control wait --for=condition=complete job/prime-rollout-check
apiVersion: batch/v1
kind: Job
metadata:
  name: prime-rollout-check
  namespace: prime-control
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: prime-supervisor:REPLACE_WITH_NEW_IMAGE_TAG
          args: ["rollout", "check", "--limit", "200"]
          envFrom:
            - secretRef:
                name: prime-supervisor-secrets
