# External Secrets Operator templates: each service gets only the secrets it uses.
# Requires ESO installed and a ClusterSecretStore (e.g. AWS/GCP/Vault).
#
#   prime-gateway-credentials  the model gateway: its service token and the vendors' API keys
#                            (no other process ever holds a provider key)
#   prime-supervisor-secrets   the supervisor API and its workers: database, gateway token,
#                            vault keys, Temporal history key, service JWT secret
#   prime-memory-secrets       the memory service: its database and the service JWT secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prime-gateway-credentials
  namespace: prime-control
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: prime-gateway-credentials
    creationPolicy: Owner
  data:
    - secretKey: MODEL_GATEWAY_TOKEN
      remoteRef:
        key: prime/model-gateway/token
    # Signs session keys, so they survive a restart (supervisor.gateway.virtual_keys).
    - secretKey: MODEL_GATEWAY_VIRTUAL_KEY_SECRET
      remoteRef:
        key: prime/model-gateway/virtual-key-secret
    # Vendor keys for the gateway's non-echo routes. Each one set also
    # auto-registers that vendor's default route (see services/supervisor/supervisor/gateway).
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: prime/model-gateway/openrouter-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prime/model-gateway/openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: prime/model-gateway/anthropic-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prime-supervisor-secrets
  namespace: prime-control
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: prime-supervisor-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prime/supervisor/database-url
    # Mints session keys at the gateway (it never holds a provider key).
    - secretKey: GATEWAY_TOKEN
      remoteRef:
        key: prime/model-gateway/token
    - secretKey: MODEL_GATEWAY_TOKEN
      remoteRef:
        key: prime/model-gateway/token
    - secretKey: SERVICE_JWT_SECRET
      remoteRef:
        key: prime/service-jwt-secret
    # Seal tenant secrets in the database (supervisor.vault); keep them out of DB backups.
    - secretKey: VAULT_KEYS
      remoteRef:
        key: prime/supervisor/vault-keys
    # Seals what Temporal stores of each session (supervisor.temporal.codec).
    - secretKey: TEMPORAL_CODEC_KEY
      remoteRef:
        key: prime/supervisor/temporal-codec-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prime-memory-secrets
  namespace: prime-control
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: prime-memory-secrets
    creationPolicy: Owner
  data:
    - secretKey: MEMORY_DATABASE_URL
      remoteRef:
        key: prime/memory/database-url
    - secretKey: SERVICE_JWT_SECRET
      remoteRef:
        key: prime/service-jwt-secret
