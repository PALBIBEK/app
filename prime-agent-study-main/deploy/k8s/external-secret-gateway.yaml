# External Secrets Operator template — gateway + DB credentials (Phase 1).
# Requires ESO installed and a ClusterSecretStore (e.g. AWS/GCP/Vault).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: yal-gateway-credentials
  namespace: yal-control
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: yal-gateway-credentials
    creationPolicy: Owner
  data:
    - secretKey: GATEWAY_TOKEN
      remoteRef:
        key: yal/model-gateway/token
    - secretKey: MODEL_GATEWAY_TOKEN
      remoteRef:
        key: yal/model-gateway/token
    - secretKey: DATABASE_URL
      remoteRef:
        key: yal/supervisor/database-url
    # Vendor keys for the gateway's non-echo routes. Each one set also
    # auto-registers that vendor's default route (see services/supervisor/supervisor/gateway).
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: yal/model-gateway/openrouter-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: yal/model-gateway/openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: yal/model-gateway/anthropic-api-key
