[project]
name = "githi"
version = "0.1.0"
description = "A minimal Python port of Pi's agent harness, with a sandboxed shell."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "prompt_toolkit>=3.0.52"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
githi = "githi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/githi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
