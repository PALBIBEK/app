harness_version: coding-v1
protocol_version: 1
runtime: harness
requires_sandbox: true
image_digest: sha256:5aec93a7fa559c073523ecb81dd8cf43232018291b7ca41b90c7c31716be106e
extension_bundle_uri: s3://harness/coding-v1.tar.gz
mode: sticky
model: anthropic/claude-sonnet-4
# tools: recovery classification only — NOT the production ToolSet catalog.
# Production tools come from composition digests → .yal/tools.json (see contracts/harness_binders.md).
tools:
  read: { class: pure }
  grep: { class: pure }
  write: { class: idempotent }
  bash: { class: non_atomic }
  echo: { class: pure }
  git_commit: { class: transactional }
recovery:
  default: fail
  by_tool_class:
    pure: auto_resume
    idempotent: auto_resume
    transactional: verify_then_resume
    non_atomic: fail
budget:
  max_cost_per_session: 5.00
  max_tokens_per_turn: 200000
guards:
  repetition: abort
  oscillation: abort
  stall_iterations: 10
approvals:
  timeout_s: 300
  on_timeout: deny
