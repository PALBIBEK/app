name: staging-auth-gate

on:
  push:
    paths:
      - "deploy/staging/**"
      - "scripts/check_staging_auth.py"
      - "contracts/service_auth.md"
  pull_request:
    paths:
      - "deploy/staging/**"
      - "scripts/check_staging_auth.py"
      - "contracts/service_auth.md"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if staging AI auth secrets empty
        run: python scripts/check_staging_auth.py
