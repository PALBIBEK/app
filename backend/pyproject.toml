[project]
name = "prime-agent"
version = "0.1.0"
description = "Production-grade FastAPI backend for AI agent platform"
authors = [
    {name = "Corridor Platforms Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    # Pydantic v2
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Authentication & Security
    "PyJWT>=2.9.0",
    "passlib[argon2]>=1.7.4",
    "python-dotenv>=1.0.0",
    "secure>=0.3.0",
    # Task Queue
    "celery>=5.4.0",
    "redis>=5.0.0",
    # Utilities
    "python-json-logger>=2.0.7",
    "tenacity>=9.0.0",  # Retry logic
    "httpx>=0.27.0",  # HTTP client for testing
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "faker>=28.0.0",
    # Code Quality
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.8.0",
    # Development
    "ipython>=8.26.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prime_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --cov=prime_agent --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[dependency-groups]
dev = []
