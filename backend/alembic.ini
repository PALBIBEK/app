# For the alembic CLI (new revisions, history). The app applies migrations itself at boot
# (prime_agent.db.migrate); the database comes from DATABASE_URL or -x url=...
#   DATABASE_URL=postgresql://yal:yal@127.0.0.1:5433/prime_agent alembic revision --autogenerate -m "..."
[alembic]
script_location = prime_agent/db/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
