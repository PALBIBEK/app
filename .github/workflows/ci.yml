name: ci

# The quality gates, on every push and PR: the agent platform (prime-agent-study-main/) with
# lint, types, every service's test suite, the end-to-end suite against a real stack
# (Postgres, Temporal, the API process serving the gateway and memory service too, and the worker)
# and a docker-compose smoke test; the product's backend/ and frontend/ suites (lint too); the
# product in a browser (dev.sh plus the Playwright journeys in frontend/e2e/); and the
# backend's client against that live stack. A live model turn runs when MODEL_E2E_API_KEY is set.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PROJECT: prime-agent-study-main
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the supervisor with its dev tools
        run: pip install -e "$PROJECT/services/supervisor[dev,postgres,s3]"
      - name: Lint (each service under its own rules)
        run: |
          status=0
          (cd "$PROJECT/services/supervisor" && ruff check supervisor tests --output-format github) || status=1
          (cd "$PROJECT/e2e" && ruff check . --output-format github) || status=1
          exit $status
      - name: Shipped catalog digests are current
        run: python "$PROJECT/harness/scripts/recompute-digests.py" --check
      - name: Compose files ship no empty auth defaults
        working-directory: ${{ env.PROJECT }}
        run: python scripts/check_staging_auth.py
      - name: Types (supervisor)
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: |
          set -o pipefail
          mypy | tee mypy.out || {
            grep -E '^supervisor/.+:[0-9]+: error:' mypy.out | head -40 \
              | sed -E 's#^([^:]+):([0-9]+): error: (.*)$#::error file=${{ env.PROJECT }}/services/supervisor/\1,line=\2::\3#'
            exit 1
          }

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -q -e ".[dev]"
      - name: Tests (the contract tests need a live supervisor, so they run in the e2e job)
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npx next lint --max-warnings 0
      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npx next build

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:  # the supervisor's migration tests run against it
        image: postgres:16
        env:
          POSTGRES_USER: yal
          POSTGRES_PASSWORD: yal
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yal" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SUPERVISOR_TEST_PG_URL: postgresql+asyncpg://yal:yal@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: pip install -e ".[dev,postgres,s3]"
      - name: Temporal CLI (the supervisor's workflow tests start a dev server)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "TEMPORAL_CLI_PATH=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
      - name: Test (the supervisor, its model gateway and its memory service)
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.out || {
            grep -E '^(FAILED|ERROR) ' pytest.out | head -40 | sed 's/^/::error::/'
            # A hung test's stack (pytest-timeout) as one annotation: job logs are not always at hand.
            if grep -q 'Timeout (>' pytest.out; then
              stack=$(awk '/^[+][+][+][+][+].* Timeout .*[+][+][+][+][+]$/{on=1} on{print}' pytest.out | tail -c 6000)
              [ -n "$stack" ] || stack=$(grep -B60 'Timeout (>' pytest.out | head -c 6000)
              stack=${stack//'%'/'%25'}; stack=${stack//$'\n'/'%0A'}
              echo "::error title=hung test stack::$stack"
            fi
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yal
          POSTGRES_PASSWORD: yal
          POSTGRES_DB: supervisor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yal -d supervisor"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: The supervisor's virtualenv (it serves the gateway and the memory service too)
        working-directory: ${{ env.PROJECT }}/services
        run: python -m venv supervisor/.venv && supervisor/.venv/bin/pip install -q -e "supervisor[dev,postgres,s3]"
      - name: Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "TEMPORAL_CLI=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
      - name: Databases and service hostnames
        run: |
          PGPASSWORD=yal psql -h 127.0.0.1 -p 5433 -U yal -d supervisor -c "create database memory"
          echo "127.0.0.1 model-gateway acp temporal memory-service" | sudo tee -a /etc/hosts
      - name: Start the stack
        run: $PROJECT/e2e/stack/up.sh || { $PROJECT/e2e/stack/annotate-logs.sh; exit 1; }
      - name: The migrated schema matches the models
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: DATABASE_URL=postgresql+asyncpg://yal:yal@127.0.0.1:5433/supervisor .venv/bin/alembic check
      - name: The backend's client against the live supervisor (before the stages restart things)
        working-directory: backend
        run: |
          python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
          CONTRACT_SUPERVISOR_URL=http://127.0.0.1:8080 \
          CONTRACT_SERVICE_JWT_SECRET='dev-local-service-jwt-secret-32b!!' \
            .venv/bin/python -m pytest -q tests/contract -p no:cacheprovider
      - name: End-to-end stages
        run: $PROJECT/e2e/run.sh || { $PROJECT/e2e/stack/annotate-logs.sh; exit 1; }
      - name: The replay gate against the live stack (every workflow the stages ran)
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: TEMPORAL_ADDRESS=127.0.0.1:7233 .venv/bin/python -m supervisor rollout check --limit 200
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: ${{ env.PROJECT }}/e2e/.run/logs/

  journeys:  # the product in a browser: ./dev.sh brings everything up, Playwright walks the pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:  # dev.sh creates its three databases on it
        image: postgres:16
        env:
          POSTGRES_USER: yal
          POSTGRES_PASSWORD: yal
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yal" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Virtualenvs, packages and the Temporal CLI
        run: |
          python -m venv $PROJECT/services/supervisor/.venv
          $PROJECT/services/supervisor/.venv/bin/pip install -q -e "$PROJECT/services/supervisor[dev,postgres,s3]"
          python -m venv backend/.venv && backend/.venv/bin/pip install -q -e "backend[dev]"
          (cd frontend && npm ci && npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium)
          curl -sSf https://temporal.download/cli.sh | sh
          echo "TEMPORAL_CLI=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
          command -v lsof || sudo apt-get install -y -q lsof
          echo "127.0.0.1 model-gateway" | sudo tee -a /etc/hosts
      - name: Start the product
        run: ./dev.sh
      - name: Builder journey
        working-directory: frontend
        run: e2e/ci-run.sh builder-journey.mjs
      - name: Memory journey
        working-directory: frontend
        run: e2e/ci-run.sh memory-journey.mjs
      - name: Environment journey (a shared sandbox setup, built as the run begins)
        working-directory: frontend
        run: e2e/ci-run.sh environment-journey.mjs
      - name: Chat journey (kills and restarts the backend mid-stream)
        working-directory: frontend
        run: e2e/ci-run.sh chat-journey.mjs
      - name: Startup journey (stops the worker, then starts it again)
        working-directory: frontend
        run: e2e/ci-run.sh startup-journey.mjs
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: journey-logs
          path: .dev/logs/

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the compose stack
        working-directory: ${{ env.PROJECT }}
        run: docker compose up -d --build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: A session runs a turn through the compose stack
        working-directory: ${{ env.PROJECT }}/e2e
        run: |
          pip install -q httpx PyJWT
          python compose_smoke.py
      - name: Compose logs
        if: failure()
        working-directory: ${{ env.PROJECT }}
        run: |
          docker compose ps -a
          # The supervisor first: a step keeps only its first ten error annotations.
          for svc in supervisor supervisor-worker $(docker compose config --services | grep -vx 'supervisor\|supervisor-worker'); do
            tail=$(docker compose logs --no-color --tail 25 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compose $svc::${tail:0:3500}"
          done
