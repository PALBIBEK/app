name: ci

# The quality gates, once per PR: the agent platform (prime-agent-study-main/) with
# lint, types, every service's test suite, the end-to-end suite against a real stack
# (Postgres, Temporal, the API process serving the gateway and memory service too, and the worker)
# and a docker-compose smoke test; the product's backend/ and frontend/ suites (lint too); the
# product in a browser (dev.sh plus the Playwright journeys in frontend/e2e/); and the
# backend's client against that live stack. A live model turn runs when MODEL_E2E_API_KEY is set.

on:
  # Once per change: as its PR. main does not run again on the merge: branch protection merges a
  # PR only when it is up to date with main and these checks passed, so what lands on main is the
  # tree its PR run tested (a squash merge of an up-to-date branch). A push to a PR's branch is not
  # a second trigger either (the PR run covers it). workflow_dispatch runs it by hand.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PROJECT: prime-agent-study-main
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the supervisor with its dev tools
        run: pip install -e "$PROJECT/services/supervisor[dev,postgres,s3]"
      - name: Lint (each service under its own rules)
        run: |
          status=0
          (cd "$PROJECT/services/supervisor" && ruff check supervisor tests --output-format github) || status=1
          (cd "$PROJECT/e2e" && ruff check . --output-format github) || status=1
          exit $status
      - name: Shipped catalog digests are current
        run: python "$PROJECT/harness/scripts/recompute-digests.py" --check
      - name: Compose files ship no empty auth defaults
        working-directory: ${{ env.PROJECT }}
        run: python scripts/check_staging_auth.py
      - name: Alert rules are valid and fire when they should
        working-directory: ${{ env.PROJECT }}/deploy/alerts
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.53.2/prometheus-2.53.2.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-2.53.2.linux-amd64/promtool
          ./promtool check rules *.rules.yml
          ./promtool test rules *.rules.test.yml
      - name: Types (supervisor)
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: |
          set -o pipefail
          mypy | tee mypy.out || {
            grep -E '^supervisor/.+:[0-9]+: error:' mypy.out | head -40 \
              | sed -E 's#^([^:]+):([0-9]+): error: (.*)$#::error file=${{ env.PROJECT }}/services/supervisor/\1,line=\2::\3#' || true
            exit 1
          }

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:  # the migrations run against it (tests/test_migrations.py)
        image: pgvector/pgvector:0.8.0-pg16  # Postgres 16 with pgvector: memory bank recall
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prime" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BACKEND_TEST_PG_URL: postgresql+asyncpg://prime:prime@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -q -e ".[dev]"
      - name: Tests (the contract tests need a live supervisor, so they run in the e2e job)
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q -rfE tests | tee pytest.out || {
            grep -E '^(FAILED|ERROR) ' pytest.out | head -20 | sed -E 's#^(FAILED|ERROR) (.*)$#::error title=backend test::\1 \2#' || true
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npx next lint --max-warnings 0
      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npx next build

  tests:
    # The suite in two halves, on two runners, each half on four workers: one runner took 9 to 21
    # minutes, the longest job of the run. pytest-split deals the tests out by their recorded
    # durations, and without a record (.test_durations) by count, which spreads the slow
    # integration tests over both halves as it does every other directory.
    name: tests (${{ matrix.group }} of 2)
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    # Chromium's libraries come with the runner image's Chrome, by the names Ubuntu 24.04 has:
    # on ubuntu-latest, now Ubuntu 26, several of them are gone.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:  # the supervisor's migration tests run against it
        image: pgvector/pgvector:0.8.0-pg16  # Postgres 16 with pgvector: memory bank recall
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prime" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SUPERVISOR_TEST_PG_URL: postgresql+asyncpg://prime:prime@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: pip install -e ".[dev,postgres,s3]"
      - name: Browser runtime (the browser code mode's tests run Chromium as its sandbox image does)
        # No --with-deps: the runner image ships Google Chrome, so Chromium's libraries are there;
        # apt-installing them again (fonts mostly) took up to eight minutes on a slow mirror.
        run: pip install "playwright==1.56.0" && python -m playwright install chromium
      - name: Temporal CLI (the supervisor's workflow tests start a dev server)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "TEMPORAL_CLI_PATH=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
      - name: Test (the supervisor, its model gateway and its memory service)
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: |
          set -o pipefail
          # Four workers (pytest-xdist): the tests mostly wait on Temporal, sandboxes and timers, so
          # four share the runner's CPUs well (19 minutes one at a time, about 9 like this), on this
          # job's half of the suite. A run still going after 30 minutes is stuck: stop it and say
          # where, instead of holding the job.
          timeout --signal=INT --kill-after=60 30m pytest -q -rfE -n 4 \
            --splits 2 --group ${{ matrix.group }} --splitting-algorithm least_duration 2>&1 | tee pytest.out || {
            status=$?
            esc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            # The shell stops at the first failing command (-e, pipefail): a grep finding nothing is one.
            grep -E '^(FAILED|ERROR) ' pytest.out | head -40 | sed 's/^/::error::/' || true
            # A hung test's stack (pytest-timeout) as one annotation: job logs are not always at hand.
            if grep -q 'Timeout (>' pytest.out; then
              stack=$(awk '/^[+][+][+][+][+].* Timeout .*[+][+][+][+][+]$/{on=1} on{print}' pytest.out | tail -c 6000)
              [ -n "$stack" ] || stack=$(grep -B60 'Timeout (>' pytest.out | head -c 6000 || true)
              echo "::error title=hung test stack::$(printf '%s\n' "$stack" | esc)"
            fi
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              # The watchdog's stacks (faulthandler_timeout) and the last lines, wherever it stopped.
              echo "::error title=test run stuck (stopped after 30 minutes)::$(tail -c 6000 pytest.out | esc)"
            fi
            exit 1
          }
      - name: Memory concurrency, 20 runs in a row (a race that fails once in twenty fails daily at scale)
        # docs/memory-gaps.md, G0: memory's concurrency tests on this job's Postgres, each run 20
        # times (about 2 minutes on four workers; each run has a database of its own); on the
        # first half's runner only, since they need no split. Failures and a stuck run are
        # annotated as the suite's are.
        if: matrix.group == 1
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=60 15m pytest -q -rfE -n 4 --count 20 \
            tests/memory_store/test_memory_concurrency.py 2>&1 | tee concurrency.out || {
            status=$?
            grep -E '^(FAILED|ERROR) ' concurrency.out | head -40 | sed 's/^/::error title=memory concurrency::/' || true
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error title=memory concurrency stuck (stopped after 15 minutes)::$(tail -c 4000 concurrency.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16  # Postgres 16 with pgvector: memory bank recall
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: supervisor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prime -d supervisor"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: The supervisor's virtualenv (it serves the gateway and the memory service too)
        working-directory: ${{ env.PROJECT }}/services
        run: python -m venv supervisor/.venv && supervisor/.venv/bin/pip install -q -e "supervisor[dev,postgres,s3]"
      - name: Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "TEMPORAL_CLI=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
      - name: Databases and service hostnames
        run: |
          PGPASSWORD=prime psql -h 127.0.0.1 -p 5433 -U prime -d supervisor -c "create database memory"
          echo "127.0.0.1 model-gateway temporal memory-service" | sudo tee -a /etc/hosts
      - name: Start the stack
        run: $PROJECT/e2e/stack/up.sh || { $PROJECT/e2e/stack/annotate-logs.sh; exit 1; }
      - name: The migrated schema matches the models
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: DATABASE_URL=postgresql+asyncpg://prime:prime@127.0.0.1:5433/supervisor .venv/bin/alembic check
      - name: The backend's client against the live supervisor (before the stages restart things)
        working-directory: backend
        run: |
          python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
          CONTRACT_SUPERVISOR_URL=http://127.0.0.1:8080 \
          CONTRACT_SERVICE_JWT_SECRET='dev-local-service-jwt-secret-32b!!' \
            .venv/bin/python -m pytest -q tests/contract -p no:cacheprovider
      - name: End-to-end stages
        run: $PROJECT/e2e/run.sh || { $PROJECT/e2e/stack/annotate-logs.sh; exit 1; }
      - name: The replay gate against the live stack (every workflow the stages ran)
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: TEMPORAL_ADDRESS=127.0.0.1:7233 .venv/bin/python -m supervisor rollout check --limit 200
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: ${{ env.PROJECT }}/e2e/.run/logs/

  journeys:  # the product in a browser: ./dev.sh brings everything up, Playwright walks the pages
    runs-on: ubuntu-24.04  # Playwright's --with-deps, as for tests
    timeout-minutes: 45
    services:
      postgres:  # dev.sh creates its three databases on it
        image: pgvector/pgvector:0.8.0-pg16  # Postgres 16 with pgvector: memory bank recall
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: prime
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prime" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Virtualenvs, packages and the Temporal CLI
        # The four installs are independent: they run side by side, each into its own log, and
        # the step fails with the first one that failed. The journeys drive the runner image's
        # Google Chrome (CHROME, as the journeys read it): no browser download and no apt-installed
        # libraries (those took up to eight minutes on a slow mirror).
        run: |
          mkdir -p /tmp/setup
          ( python -m venv $PROJECT/services/supervisor/.venv \
            && $PROJECT/services/supervisor/.venv/bin/pip install -q -e "$PROJECT/services/supervisor[dev,postgres,s3]" ) > /tmp/setup/supervisor.log 2>&1 &
          s=$!
          ( python -m venv backend/.venv && backend/.venv/bin/pip install -q -e "backend[dev]" ) > /tmp/setup/backend.log 2>&1 &
          b=$!
          ( cd frontend && npm ci && npm i --no-save playwright@1.48.2 ) > /tmp/setup/frontend.log 2>&1 &
          f=$!
          ( curl -sSf https://temporal.download/cli.sh | sh ) > /tmp/setup/temporal.log 2>&1 &
          t=$!
          status=0
          for job in "supervisor:$s" "backend:$b" "frontend:$f" "temporal:$t"; do
            wait "${job#*:}" || { status=1; echo "::error title=${job%%:*} setup failed::$(tail -c 3000 /tmp/setup/${job%%:*}.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          done
          [ "$status" -eq 0 ] || exit 1
          echo "TEMPORAL_CLI=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -n "$chrome" ]; then
            echo "CHROME=$chrome" >> "$GITHUB_ENV"
          else  # an image without Chrome: Playwright's own, with its libraries
            (cd frontend && npx playwright install --with-deps chromium)
          fi
          command -v lsof || sudo apt-get install -y -q lsof
          echo "127.0.0.1 model-gateway" | sudo tee -a /etc/hosts
      - name: Start the product
        run: ./dev.sh
      - name: Builder journey
        working-directory: frontend
        run: e2e/ci-run.sh builder-journey.mjs
      - name: Memory journey
        working-directory: frontend
        run: e2e/ci-run.sh memory-journey.mjs
      - name: Environment journey (a shared sandbox setup, built as the run begins)
        working-directory: frontend
        run: e2e/ci-run.sh environment-journey.mjs
      - name: Operate journey (approvals inbox, sandboxes, usage, secrets, runners, publish checks)
        working-directory: frontend
        run: e2e/ci-run.sh operate-journey.mjs
      - name: Traces journey (runs list, transcript, tree, raw events, session replay)
        working-directory: frontend
        run: e2e/ci-run.sh traces-journey.mjs
      - name: Subagents journey (a subagent asks, answers and has its own page; a continuable one takes a person's message)
        working-directory: frontend
        run: e2e/ci-run.sh subagents-journey.mjs
      - name: Chat journey (kills and restarts the backend mid-stream)
        working-directory: frontend
        run: e2e/ci-run.sh chat-journey.mjs
      - name: Startup journey (stops the worker, then starts it again)
        working-directory: frontend
        run: e2e/ci-run.sh startup-journey.mjs
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: journey-logs
          path: .dev/logs/

  browser-sandboxes:
    # The browser code mode and sandbox networks in real local_docker sandboxes, as sessions
    # get them: the test machine has no Docker daemon of its own, so this is where they run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: ${{ env.PROJECT }}/services/supervisor
        run: pip install -e ".[dev]"
      - name: The browser sandbox image, built as deployments build it (the shipped profile names it)
        run: docker build -t githi-browser-sandbox:1.56.0 ${{ env.PROJECT }}/deploy/sandbox-images/browser
      - name: Ports 80 and 443 for the stand-in internet (the network tests serve it here)
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      - name: Test
        working-directory: ${{ env.PROJECT }}/services/supervisor
        env:
          SUPERVISOR_TEST_BROWSER_IMAGE: githi-browser-sandbox:1.56.0
        run: pytest -q -rfEs tests/integration/test_browser_exec_docker.py tests/integration/test_sandbox_network_docker.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the compose stack
        working-directory: ${{ env.PROJECT }}
        run: docker compose up -d --build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: A session runs a turn through the compose stack
        working-directory: ${{ env.PROJECT }}/e2e
        run: |
          pip install -q httpx PyJWT
          python compose_smoke.py
      - name: Compose logs
        if: failure()
        working-directory: ${{ env.PROJECT }}
        run: |
          docker compose ps -a
          # The supervisor first: a step keeps only its first ten error annotations.
          for svc in supervisor supervisor-worker $(docker compose config --services | grep -vx 'supervisor\|supervisor-worker'); do
            tail=$(docker compose logs --no-color --tail 25 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compose $svc::${tail:0:3500}"
          done
